<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Troop 402 API &amp; Services</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(52, 211, 153, 0.15);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .endpoints {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      text-align: left;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
    }
    .endpoints div {
      padding: 0.25rem 0;
      display: flex;
      justify-content: space-between;
    }
    .endpoints a {
      color: var(--accent);
      text-decoration: none;
    }
    .endpoints a:hover {
      text-decoration: underline;
    }
    .footer-link {
      color: #64748b;
      font-size: 0.8rem;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .footer-link:hover {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>API Services Operational</span>
    </div>
    <h1>Troop 402 API</h1>
    <p>Integration and data services for Boy Scout Troop 402 of Lafayette, CA.</p>

    <div class="endpoints">
      <div>
        <span>Health Status</span>
        <a href="/api/health">/api/health</a>
      </div>
      <div>
        <span>Service Probe</span>
        <a href="/healthz">/healthz</a>
      </div>
      <div>
        <span>OpenAPI 3.0</span>
        <a href="/openapi.yaml" style="color:#a78bfa;">/openapi.yaml</a>
      </div>
    </div>

    <div>
      <a href="/manager.html" class="footer-link">Manager Console &rarr;</a>
    </div>
  </div>
</body>
</html>
