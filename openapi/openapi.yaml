openapi: 3.0.3
info:
  title: troop-api
  version: 0.2.0-alpha
  description: |
    Alpha API for troop data integration, TroopWebHost roster exports, upcoming events, and carpool intelligence.
    Enforces a two-tier authentication architecture:
    - Tier 1: Shared application key (`x-troop-key` header or `?key=` query param) for read-only troop endpoints.
    - Tier 2: Signed coordinator session token (`Authorization: Bearer <token>`) for driver state mutations.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://troop-api.internal
    description: Internal deployment URL

security:
  - TroopAppKeyHeader: []
  - TroopAppKeyQuery: []
  - CoordinatorBearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: App health check
      description: Returns a basic success signal to confirm the service is running.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Unexpected internal server error
          content:
            text/plain:
              schema:
                type: string

  /api/auth/coordinator-login:
    post:
      operationId: loginCoordinator
      summary: Authenticate coordinator session
      description: Validates coordinator password and returns a signed 5-minute bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  example: 'scouts-lead-the-way'
      responses:
        '200':
          description: Session successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  token:
                    type: string
                  expiresIn:
                    type: integer
                  expiresInMs:
                    type: integer
                  expiresAt:
                    type: integer
        '400':
          description: Password is required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Incorrect password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/export-roster:
    post:
      operationId: exportRoster
      summary: Export the roster from TroopWebHost
      description: Authenticates to TroopWebHost and returns the roster export as a CSV file.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                forceRefresh:
                  type: boolean
                  example: false
      responses:
        '200':
          description: CSV roster export returned successfully
          content:
            text/csv:
              schema:
                type: string
                example: 'Name,Email,Phone\nExample Scout,scout@example.com,555-0100'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Server configuration, export, or authentication failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/roster/summary:
    get:
      operationId: getRosterSummary
      summary: Get summary statistics of the troop roster
      description: Returns total members, scout count, adult count, and cache metadata.
      responses:
        '200':
          description: Roster summary statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalMembers:
                    type: integer
                    example: 210
                  scoutsCount:
                    type: integer
                    example: 142
                  adultsCount:
                    type: integer
                    example: 68
                  cachedAt:
                    type: string
                    format: date-time
                  fresh:
                    type: boolean
                    example: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to retrieve or parse roster
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/events:
    get:
      operationId: getUpcomingEvents
      summary: List upcoming troop events
      description: Returns upcoming events within a given date window (default 90 days).
      parameters:
        - name: days
          in: query
          required: false
          description: Number of days ahead to look for events
          schema:
            type: integer
            default: 90
            example: 60
      responses:
        '200':
          description: List of upcoming events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '1983'
                        title:
                          type: string
                          example: Death Valley Campout
                        eventType:
                          type: string
                          example: Campout Under the Stars - Short Term
                        location:
                          type: string
                          example: Stove Pipe Wells Campground
                        isCarpoolCandidate:
                          type: boolean
                          example: true
                        start:
                          type: string
                          example: 02/12/27
                        end:
                          type: string
                          example: 02/15/27
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to retrieve events
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/events/{id}/carpool.xlsx:
    get:
      operationId: exportEventCarpoolExcel
      summary: Download event carpool coordinator Excel spreadsheet
      description: Generates a pre-populated Excel (.xlsx) workbook modeled after the traditional coordinator sheet, including outbound/return tables, slots 1-9, driver cell phones, and unassigned waitlists.
      parameters:
        - name: id
          in: path
          required: true
          description: The TroopWebHost event ID
          schema:
            type: string
            example: '1957'
      responses:
        '200':
          description: Excel spreadsheet download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid event ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to generate carpool spreadsheet
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      operationId: exportEventCarpoolExcelWithCustomState
      summary: Download event carpool coordinator Excel spreadsheet with live working state
      description: Generates an Excel (.xlsx) workbook applying live coordinator edits (custom drivers, reconfigured seats, and manual assignments).
      parameters:
        - name: id
          in: path
          required: true
          description: The TroopWebHost event ID
          schema:
            type: string
            example: '1957'
      requestBody:
        description: Custom coordinator working state
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                toDrivers:
                  type: array
                  items:
                    type: object
                fromDrivers:
                  type: array
                  items:
                    type: object
                unassignedScouts:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Excel spreadsheet download reflecting live coordinator edits
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid event ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to generate carpool spreadsheet
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/events/{id}/tabular.xlsx:
    get:
      operationId: exportEventCarpoolTabularExcel
      summary: Download event carpool flat cartesian tabular Excel spreadsheet
      description: Generates a single-sheet flat cartesian tabular Excel (.xlsx) workbook where each driver-rider combination is split into its own row, with selectable columns and trip leg splitting.
      parameters:
        - name: id
          in: path
          required: true
          description: The TroopWebHost event ID
          schema:
            type: string
            example: '1957'
        - name: columns
          in: query
          required: false
          description: Comma-separated list of column IDs in desired display order
          schema:
            type: string
            example: 'trip_leg,adult_name,adult_cell,rider_name,rider_patrol'
        - name: splitTripLegs
          in: query
          required: false
          description: When true (default), emits discrete TO and FROM rows. When false, coalesces identical rides into a single row marked "Both".
          schema:
            type: boolean
            default: true
        - name: includeOpenSeats
          in: query
          required: false
          description: When true (default), emits a row for each open seat offered by drivers.
          schema:
            type: boolean
            default: true
        - name: includeUnassigned
          in: query
          required: false
          description: When true (default), emits rows for attending scouts without assigned rides.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Tabular Excel spreadsheet download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid event ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to generate tabular spreadsheet
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      operationId: exportEventCarpoolTabularExcelWithCustomState
      summary: Download event carpool tabular Excel spreadsheet with custom state and column selection
      description: Generates a flat cartesian tabular Excel (.xlsx) workbook accepting live coordinator edits, customized column lists, and trip leg options.
      parameters:
        - name: id
          in: path
          required: true
          description: The TroopWebHost event ID
          schema:
            type: string
            example: '1957'
      requestBody:
        description: Tabular export configuration and optional live coordinator working state
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                columns:
                  type: array
                  items:
                    type: string
                splitTripLegs:
                  type: boolean
                  default: true
                includeOpenSeats:
                  type: boolean
                  default: true
                includeUnassigned:
                  type: boolean
                  default: true
                customState:
                  type: object
      responses:
        '200':
          description: Tabular Excel spreadsheet download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid event ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to generate tabular spreadsheet
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/events/{id}/carpool:
    get:
      operationId: getEventCarpool
      summary: Get event carpool and driver attendance details
      description: Combines driver registrations, attending adults, and attending scouts for an event with driver comment intelligence.
      parameters:
        - name: id
          in: path
          required: true
          description: The TroopWebHost event ID
          schema:
            type: string
            example: '1983'
      responses:
        '200':
          description: Detailed carpool and attendance analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId:
                    type: string
                  stats:
                    type: object
                    properties:
                      totalDrivers:
                        type: integer
                      totalSeatsOffered:
                        type: integer
                      totalOpenSeats:
                        type: integer
                      totalAttendingScouts:
                        type: integer
                      assignedScoutsCount:
                        type: integer
                      unassignedScoutsCount:
                        type: integer
                      totalAttendingAdults:
                        type: integer
                      adultRidersCount:
                        type: integer
                      totalAttendees:
                        type: integer
                      seatBalance:
                        type: integer
                        description: Scout-centric seat balance (positive is surplus, negative is deficit)
                      nonCompliantDriversCount:
                        type: integer
                        description: Count of drivers with expired or incomplete youth safety compliance
                      clarificationsNeeded:
                        type: array
                        items:
                          type: object
                          properties:
                            driverName:
                              type: string
                            token:
                              type: string
                            candidates:
                              type: array
                              items:
                                type: string
                            note:
                              type: string
                  drivers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        attending:
                          type: string
                        drivingToFrom:
                          type: string
                        seats:
                          type: integer
                        comment:
                          type: string
                        phone:
                          type: string
                        email:
                          type: string
                        registeredVehicle:
                          type: string
                        sytStatus:
                          type: string
                        stateTraining:
                          type: string
                        bsaRegistered:
                          type: string
                        isCompliant:
                          type: boolean
                        claimedScouts:
                          type: array
                        claimedAdults:
                          type: array
                        ambiguousNotes:
                          type: array
                        openSeats:
                          type: integer
                        explicitOpenNote:
                          type: string
                  adults:
                    type: array
                    items:
                      type: object
                  scouts:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        patrol:
                          type: string
                        swimTest:
                          type: string
                        permissionGiven:
                          type: string
                        assignedDriver:
                          type: string
                          nullable: true
                        rideStatus:
                          type: string
                        rideNote:
                          type: string
        '400':
          description: Missing or invalid event ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to retrieve event details
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/events/{id}/driver-update:
    post:
      operationId: updateEventDriver
      summary: Update driver comment and capacity directly in TroopWebHost
      description: Updates a driver's comments, seat count, and travel leg directly in the TroopWebHost event sign-up table with inline conflict checking.
      security:
        - CoordinatorBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The TroopWebHost event ID
          schema:
            type: string
            example: '1957'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - driverName
              properties:
                driverName:
                  type: string
                  example: 'Simone, Jason'
                updatedComment:
                  type: string
                  example: 'Taking: Evelyn Adams. Notes: Depart 4:30 PM'
                passengerSeats:
                  type: integer
                  example: 3
                drivingToFrom:
                  type: string
                  enum: [Both, To, From]
                  example: Both
                isDriver:
                  type: boolean
                  example: true
                baselineComment:
                  type: string
                  example: 'previous comment in TWH'
                force:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Driver successfully updated in TroopWebHost
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  driverName:
                    type: string
                  updatedComment:
                    type: string
                  passengerSeats:
                    type: integer
                  drivingToFrom:
                    type: string
        '400':
          description: Missing or invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: Conflict detected - TWH comment has changed since baseline
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflict:
                    type: boolean
                  driverName:
                    type: string
                  liveComment:
                    type: string
                  proposedComment:
                    type: string
                  message:
                    type: string
        '500':
          description: Failed to update driver in TroopWebHost
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/events/{id}/twh-status:
    get:
      operationId: getEventTwhStatus
      summary: Check for external changes in TroopWebHost
      description: Returns lightweight signature and counts to detect if TroopWebHost has changed while the coordinator was away.
      parameters:
        - name: id
          in: path
          required: true
          description: The TroopWebHost event ID
          schema:
            type: string
            example: '1957'
      responses:
        '200':
          description: Current event status signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId:
                    type: string
                  driverCount:
                    type: integer
                  scoutCount:
                    type: integer
                  totalSeatsOffered:
                    type: integer
                  signature:
                    type: string
                  timestamp:
                    type: integer
        '400':
          description: Invalid event ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to fetch event status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

components:
  securitySchemes:
    TroopAppKeyHeader:
      type: apiKey
      in: header
      name: x-troop-key
      description: Shared troop application access key for read-only operations
    TroopAppKeyQuery:
      type: apiKey
      in: query
      name: key
      description: Shared troop application access key for read-only operations
    CoordinatorBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed 5-minute coordinator session bearer token issued by /api/auth/coordinator-login


