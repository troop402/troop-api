openapi: 3.0.3
info:
  title: troop-api
  version: 0.1.0-alpha
  description: |
    Alpha API for troop data integration, TroopWebHost roster exports, upcoming events, and carpool intelligence.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://troop-api.internal
    description: Internal deployment URL

security: []

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: App health check
      description: Returns a basic success signal to confirm the service is running.
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Unexpected internal server error
          content:
            text/plain:
              schema:
                type: string

  /api/export-roster:
    post:
      operationId: exportRoster
      summary: Export the roster from TroopWebHost
      description: Authenticates to TroopWebHost and returns the roster export as a CSV file.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                forceRefresh:
                  type: boolean
                  example: false
      responses:
        '200':
          description: CSV roster export returned successfully
          content:
            text/csv:
              schema:
                type: string
                example: 'Name,Email,Phone\nExample Scout,scout@example.com,555-0100'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Server configuration, export, or authentication failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/roster/summary:
    get:
      operationId: getRosterSummary
      summary: Get summary statistics of the troop roster
      description: Returns total members, scout count, adult count, and cache metadata.
      responses:
        '200':
          description: Roster summary statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalMembers:
                    type: integer
                    example: 210
                  scoutsCount:
                    type: integer
                    example: 142
                  adultsCount:
                    type: integer
                    example: 68
                  cachedAt:
                    type: string
                    format: date-time
                  fresh:
                    type: boolean
                    example: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to retrieve or parse roster
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/events:
    get:
      operationId: getUpcomingEvents
      summary: List upcoming troop events
      description: Returns upcoming events within a given date window (default 90 days).
      parameters:
        - name: days
          in: query
          required: false
          description: Number of days ahead to look for events
          schema:
            type: integer
            default: 90
            example: 60
      responses:
        '200':
          description: List of upcoming events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '1983'
                        title:
                          type: string
                          example: Death Valley Campout
                        eventType:
                          type: string
                          example: Campout Under the Stars - Short Term
                        location:
                          type: string
                          example: Stove Pipe Wells Campground
                        isCarpoolCandidate:
                          type: boolean
                          example: true
                        start:
                          type: string
                          example: 02/12/27
                        end:
                          type: string
                          example: 02/15/27
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to retrieve events
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/events/{id}/carpool.xlsx:
    get:
      operationId: exportEventCarpoolExcel
      summary: Download event carpool coordinator Excel spreadsheet
      description: Generates a pre-populated Excel (.xlsx) workbook modeled after the traditional coordinator sheet, including outbound/return tables, slots 1-9, driver cell phones, and unassigned waitlists.
      parameters:
        - name: id
          in: path
          required: true
          description: The TroopWebHost event ID
          schema:
            type: string
            example: '1957'
      responses:
        '200':
          description: Excel spreadsheet download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid event ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to generate carpool spreadsheet
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/events/{id}/carpool:
    get:
      operationId: getEventCarpool
      summary: Get event carpool and driver attendance details
      description: Combines driver registrations, attending adults, and attending scouts for an event with driver comment intelligence.
      parameters:
        - name: id
          in: path
          required: true
          description: The TroopWebHost event ID
          schema:
            type: string
            example: '1983'
      responses:
        '200':
          description: Detailed carpool and attendance analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId:
                    type: string
                  stats:
                    type: object
                    properties:
                      totalDrivers:
                        type: integer
                      totalSeatsOffered:
                        type: integer
                      totalOpenSeats:
                        type: integer
                      totalAttendingScouts:
                        type: integer
                      assignedScoutsCount:
                        type: integer
                      unassignedScoutsCount:
                        type: integer
                      totalAttendingAdults:
                        type: integer
                      adultRidersCount:
                        type: integer
                      totalAttendees:
                        type: integer
                      seatBalance:
                        type: integer
                        description: Scout-centric seat balance (positive is surplus, negative is deficit)
                      nonCompliantDriversCount:
                        type: integer
                        description: Count of drivers with expired or incomplete youth safety compliance
                      clarificationsNeeded:
                        type: array
                        items:
                          type: object
                          properties:
                            driverName:
                              type: string
                            token:
                              type: string
                            candidates:
                              type: array
                              items:
                                type: string
                            note:
                              type: string
                  drivers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        attending:
                          type: string
                        drivingToFrom:
                          type: string
                        seats:
                          type: integer
                        comment:
                          type: string
                        phone:
                          type: string
                        email:
                          type: string
                        registeredVehicle:
                          type: string
                        sytStatus:
                          type: string
                        stateTraining:
                          type: string
                        bsaRegistered:
                          type: string
                        isCompliant:
                          type: boolean
                        claimedScouts:
                          type: array
                        claimedAdults:
                          type: array
                        ambiguousNotes:
                          type: array
                        openSeats:
                          type: integer
                        explicitOpenNote:
                          type: string
                  adults:
                    type: array
                    items:
                      type: object
                  scouts:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        patrol:
                          type: string
                        swimTest:
                          type: string
                        permissionGiven:
                          type: string
                        assignedDriver:
                          type: string
                          nullable: true
                        rideStatus:
                          type: string
                        rideNote:
                          type: string
        '400':
          description: Missing or invalid event ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to retrieve event details
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
