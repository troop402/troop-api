name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate OpenAPI contract
        run: npm run api:validate

      - name: Test live TroopWebHost export
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm run test:integration
        env:
          TWH_TROOP_URL: ${{ secrets.TWH_TROOP_URL }}
          TWH_USERNAME: ${{ secrets.TWH_USERNAME }}
          TWH_PASSWORD: ${{ secrets.TWH_PASSWORD }}